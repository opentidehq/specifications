# Website sync guard.
#
# opentidehq/website syncs this repository (as vendor/specifications) every
# hour in its "Sync docs and deploy" job. A change that passes this repo's
# own CI can still break that job: MDX the website refuses, or a platform
# field the landing page still shows. The site then stops updating.
#
# This workflow runs the website's sync and its checks against this PR's
# tree, so such a break fails here, in the PR that causes it.
#
# Required-check candidate: "website-sync / website". The workflow starts on
# every PR, and the `changes` job skips `website` when the PR touches no
# synced path. A skipped job satisfies a required check, so PRs that touch
# only scripts/ or fixtures/ are not blocked.
name: website-sync

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "specs/**"
      - "rfcs/**"
      - "vocabularies/**"
      - "site/**"
      - "SPECS.md"
      - "GOVERNANCE.md"
      - "CHANGELOG.md"
      - ".github/workflows/website-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      synced: ${{ steps.diff.outputs.synced }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - name: Did this PR change content the website syncs?
        id: diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "synced=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The PR merge commit's first parent is the base branch tip.
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if grep -qE '^(specs/|rfcs/|vocabularies/|site/|SPECS\.md$|GOVERNANCE\.md$|CHANGELOG\.md$|\.github/workflows/website-sync\.yml$)' <<<"$changed"; then
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "No synced path changed; the website job is skipped."
          fi

  website:
    name: website
    needs: changes
    if: needs.changes.outputs.synced == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out opentidehq/website (main)
        uses: actions/checkout@v4
        with:
          repository: opentidehq/website
          ref: main
          path: website
          submodules: false
          persist-credentials: false

      - name: Check out this tree as vendor/specifications
        uses: actions/checkout@v4
        with:
          path: website/vendor/specifications
          persist-credentials: false

      - name: Read the opentide branch the website syncs
        id: opentide
        working-directory: website
        run: |
          set -euo pipefail
          branch=$(git config -f .gitmodules --get submodule.vendor/opentide.branch || echo development)
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "opentide docs from $branch (website .gitmodules)"

      - name: Check out opentidehq/opentide as vendor/opentide
        uses: actions/checkout@v4
        with:
          repository: opentidehq/opentide
          ref: ${{ steps.opentide.outputs.branch }}
          path: website/vendor/opentide
          sparse-checkout: docs
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      # Runs the website's MDX safety check on every synced page; a refusal
      # ("Refusing to publish MDX ...") fails here with the file and reason.
      - name: pnpm sync:content
        working-directory: website
        run: |
          set -o pipefail
          pnpm sync:content 2>&1 | tee "$RUNNER_TEMP/sync.log" || {
            {
              echo "## Website sync refused this tree"
              echo '```'
              grep -v '^    at ' "$RUNNER_TEMP/sync.log" | tail -n 20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            msg=$(grep -v '^    at ' "$RUNNER_TEMP/sync.log" | grep -A2 -E '^Error' | head -n 3 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=website sync:content::${msg:-pnpm sync:content failed}"
            exit 1
          }

      # The website's whole unit suite (~5 s), including lib/landing/integrations.test.ts
      # (landing fields must exist in the synced platform specs) and the MDX
      # safety and docs-sync tests. The one test skipped compares the website's
      # own committed vendor gitlinks with content/docs, which this job replaces
      # on purpose.
      - name: pnpm test
        working-directory: website
        env:
          NODE_OPTIONS: --test-skip-pattern="workspace committed docs match vendor gitlinks"
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            {
              echo "## Website tests failed on this tree"
              echo '```'
              grep -E -A2 '^\s*(AssertionError|Error)' "$RUNNER_TEMP/test.log" | head -n 30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '^\s*AssertionError' "$RUNNER_TEMP/test.log" | sort -u | head -n 10 \
              | sed -E 's/^\s*/::error title=website test::/'
            exit 1
          }

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: website/.next/cache
          key: next-${{ hashFiles('website/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('website/pnpm-lock.yaml') }}-

      # next build compiles every synced page through fumadocs-mdx with the
      # site's frontmatter schema, renders its components, and type-checks.
      # MDX can pass the sync's parse check and still fail here (an unknown
      # component, a bad frontmatter value), and verify:docs reads the
      # exported out/ tree, so the guard needs the build. `next build` is run
      # directly: `pnpm build` would run prebuild (PyPI and engine downloads,
      # changelog sync, which do not depend on this tree).
      - name: next build
        working-directory: website
        run: pnpm exec next build

      - name: pnpm verify:docs
        working-directory: website
        run: pnpm verify:docs
