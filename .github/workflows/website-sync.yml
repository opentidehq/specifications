# Website sync guard.
#
# opentidehq/website syncs this repository (as vendor/specifications) every
# hour in its "Sync docs and deploy" job. A change that passes this repo's
# own CI can still break that job: MDX the website refuses, or a platform
# field the landing page still shows. The site then stops updating.
#
# This workflow runs the website's `pnpm check:upstream` against this PR's
# tree: the same command the hourly sync uses to decide whether it accepts
# an upstream tree, so such a break fails here, in the PR that causes it.
# The checks themselves are listed only in the website's
# scripts/check-upstream.mjs (see its AGENTS.md, "Upstream checks"); do not
# repeat them here.
#
# Required-check candidate: "website-sync / website". The workflow starts on
# every PR, and the `changes` job skips `website` when the PR touches no
# synced path. A skipped job satisfies a required check, so PRs that touch
# only scripts/ or fixtures/ are not blocked.
name: website-sync

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "specs/**"
      - "rfcs/**"
      - "vocabularies/**"
      - "site/**"
      - "SPECS.md"
      - "GOVERNANCE.md"
      - "CHANGELOG.md"
      - ".github/workflows/website-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      synced: ${{ steps.diff.outputs.synced }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - name: Did this PR change content the website syncs?
        id: diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "synced=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The PR merge commit's first parent is the base branch tip.
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if grep -qE '^(specs/|rfcs/|vocabularies/|site/|SPECS\.md$|GOVERNANCE\.md$|CHANGELOG\.md$|\.github/workflows/website-sync\.yml$)' <<<"$changed"; then
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "No synced path changed; the website job is skipped."
          fi

  website:
    name: website
    needs: changes
    if: needs.changes.outputs.synced == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out opentidehq/website (main)
        uses: actions/checkout@v4
        with:
          repository: opentidehq/website
          ref: main
          path: website
          submodules: false
          persist-credentials: false

      - name: Check out this tree as vendor/specifications
        uses: actions/checkout@v4
        with:
          path: website/vendor/specifications
          persist-credentials: false

      # opentide needs only docs/; it must stay a git checkout, since
      # check:docs --worktree compares its HEAD with the sync stamp.
      - name: Check out opentidehq/opentide (development) as vendor/opentide
        uses: actions/checkout@v4
        with:
          repository: opentidehq/opentide
          ref: development
          path: website/vendor/opentide
          sparse-checkout: docs
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      # check:upstream runs next build; its cache only speeds that up.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: website/.next/cache
          key: next-${{ hashFiles('website/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('website/pnpm-lock.yaml') }}-

      - name: pnpm check:upstream
        working-directory: website
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/check-upstream.json"
          if pnpm check:upstream --report "$report"; then
            exit 0
          fi
          if [ -s "$report" ]; then
            failed=$(jq -r '.failed // "unknown"' "$report")
            {
              echo "## The website would not accept this tree"
              echo
              echo "\`pnpm check:upstream\` failed at **${failed}**."
              echo
              echo '```'
              jq -r '.tail' "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            msg=$(jq -r '.tail' "$report" | tail -n 15 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=website check:upstream (${failed})::${msg:-pnpm check:upstream failed}"
          else
            echo "::error title=website check:upstream::pnpm check:upstream failed before writing its report"
          fi
          exit 1
