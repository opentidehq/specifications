# A 0.20.0 file with plural dataset lists.

[[logsources]]
name = "Custom tables"
description = "Custom connector tables"
system = "sentinel"
tenants = ["Production"]
tables = ["Contoso_Audit_CL", "Fabrikam_Proxy_CL"]

[[logsources]]
name = "Sign-ins"
description = "Entra ID sign-ins"
system = "sentinel"
tables = ["SigninLogs"]

[[logsources]]
name = "Windows security"
description = "Domain controller security log"
system = "splunk"
references = ["https://example.org/wineventlog"]
indexes = ["wineventlog"]
sourcetypes = ["WinEventLog:Security", "XmlWinEventLog:Security"]
macros = ["wineventlog_security"]

[[logsources]]
name = "Endpoint"
description = "Endpoint telemetry"
system = "elastic"
indices = ["logs-endpoint.events.*"]
data_views = ["security-solution-default"]
ecs = true

[[logsources]]
name = "Splunk macros"
description = "Searches through macros"
system = "splunk"
macros = ["sysmon"]

# No plural key: left unchanged.
[[logsources]]
name = "Badge readers"
description = "Physical access logs held by the facilities team"
system = "sentinel_one"
