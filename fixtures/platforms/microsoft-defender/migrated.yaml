name: Defender for Endpoint platform block
metadata:
  uuid: 00000000-0000-4000-8003-000000000012
  schema: rule::1.0
  version: 1
  created: "2026-01-01"
  modified: "2026-01-02"
  tlp: clear
description: |
  Defender custom detection with a device entity and an isolate action.
status: STAGING
severity: High
response:
  alert_severity: High
configurations:
  microsoft_defender:
    enabled: true
    schema: platform::microsoft_defender::1.0
    status: STAGING
    query: |
      DeviceProcessEvents
      | where FileName =~ "cmd.exe"
      | take 1
    schedule:
      frequency: 1H
    alert:
      title: Suspicious command processor
      severity: High
    entities:
      hosts:
        - device_id: DeviceId
      accounts:
        - name: AccountName
    actions:
      isolate_devices:
        - device_id: DeviceId
          isolation_type: full
      collect_investigation_packages:
        - device_id: DeviceId
